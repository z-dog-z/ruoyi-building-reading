<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR 漫游演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
        }
        .vr-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        h1 {
            font-size: 28px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            font-size: 16px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 12px;
        }
        .features {
            margin-top: 30px;
            display: grid;
            gap: 16px;
        }
        .feature {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .feature-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #667eea;
        }
        .feature-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="vr-icon">🕶️</div>
        <h1>VR 漫游演示</h1>
        <p>欢迎来到山西农业大学 VR 漫游体验</p>
        <p>点击下方建筑开始您的虚拟之旅</p>

        <div class="features">
            <div class="feature">
                <div class="feature-title">🏛️ 山西铭贤学校旧址</div>
                <div class="feature-desc">百年学府，中西合璧的建筑典范</div>
            </div>
            <div class="feature">
                <div class="feature-title">📚 图书馆大楼</div>
                <div class="feature-desc">藏书万卷，知识的海洋</div>
            </div>
            <div class="feature">
                <div class="feature-title">🏠 韩氏楼</div>
                <div class="feature-desc">红色印记，革命历史的见证</div>
            </div>
        </div>

        <div class="footer">建筑可阅读 · 山西农业大学</div>
    </div>
</body>
</html>
